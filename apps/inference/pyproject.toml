[project]
name = "pyro-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "truststore>=0.10",
    "scikit-learn>=1.6",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
